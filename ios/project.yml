# The Xcode project for the iPhone app, generated by XcodeGen (`xcodegen generate` in this folder, done by the
# GitHub build in ../.github/workflows/ios.yml). LiquidCloud/ is the Swift app, Resources/engine.js the script
# it runs inside the hidden SoundCloud page.
name: LiquidCloud
options:
  bundleIdPrefix: com.presl
  deploymentTarget:
    iOS: "26.0"
targets:
  LiquidCloud:
    type: application
    platform: iOS
    sources:
      - path: LiquidCloud
      - path: Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.presl.liquidcloud
        PRODUCT_NAME: LiquidCloud
        MARKETING_VERSION: "2.9"
        CURRENT_PROJECT_VERSION: "11"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: LiquidCloud
        LSRequiresIPhoneOS: true
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
