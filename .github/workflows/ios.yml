# Builds the iPhone app on one of GitHub's Macs and keeps the result as LiquidCloud.ipa (Actions > the run >
# Artifacts). The .ipa is unsigned: Sideloadly or AltStore signs it with your Apple ID when installing.
name: iPhone app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      # Liquid Glass needs the iOS 26 SDK: use the newest Xcode 26 on the machine
      - name: Pick Xcode 26
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Make the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Build the app
        run: |
          xcodebuild -project ios/LiquidCloud.xcodeproj -scheme LiquidCloud -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Pack it as an .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LiquidCloud.app Payload/
          zip -qry LiquidCloud.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: LiquidCloud-ipa
          path: LiquidCloud.ipa
